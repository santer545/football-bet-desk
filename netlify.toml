[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/football/*"
  to = "/.netlify/functions/football/:splat"
  status = 200

[[redirects]]
  from = "/api/football"
  to = "/.netlify/functions/football-root"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
